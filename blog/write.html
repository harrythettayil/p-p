<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write a post | Posies &amp; Petals</title>
<meta name="description" content="Write a post for the Posies &amp; Petals blog.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="blog.css">
</head>
<body>
<div id="site-header" data-root="../" data-auth></div>

<main class="blog-main"><div class="wrap">
  <div class="editor">
    <h2>Write a post</h2>
    <p class="lead" style="margin-bottom:10px">New posts are reviewed before they appear on the blog. Leave a blank line between paragraphs.</p>
    <form id="postForm">
      <label for="title">Title</label>
      <input id="title" maxlength="150" required>
      <label for="excerpt">Short summary (optional)</label>
      <input id="excerpt" maxlength="300">
      <label for="body">Post</label>
      <textarea id="body" style="min-height:260px" maxlength="20000" required></textarea>
      <div class="char-count" id="count">0 / 20000</div>
      <button class="btn" type="submit">Submit for review</button>
      <p class="form-msg" id="pmsg" role="status"></p>
    </form>
  </div>
  <div class="editor"><h2>My posts</h2><div id="mine"></div></div>
</div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="../layout.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="write.js"></script>
</body>
</html>
