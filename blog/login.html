<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Posies &amp; Petals</title>
<meta name="description" content="Sign in or create an account to write posts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="blog.css">
</head>
<body>
<div id="site-header" data-root="../" data-auth></div>

<main class="blog-main"><div class="wrap"><div class="auth-box">
  <h2 id="auth-title">Sign in</h2>
  <form id="authForm">
    <div id="name-row" hidden>
      <label for="dname">Display name</label>
      <input id="dname" maxlength="60">
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="email">
    <label for="password">Password</label>
    <input id="password" type="password" minlength="8" required autocomplete="current-password">
    <button class="btn" type="submit" id="auth-submit">Sign in</button>
    <p class="form-msg" id="amsg" role="status"></p>
    <p style="margin-top:14px"><a href="#" id="toggle-mode">New here? Create an account</a></p>
  </form>
</div></div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="../layout.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="login.js"></script>
</body>
</html>
